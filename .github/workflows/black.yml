name: Black Code Formatter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  black:
    runs-on: ubuntu-latest
    env:
      BLACK_VERSION: "24.10.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run Black
        run: uv tool run "black@${BLACK_VERSION}" --check --diff .
