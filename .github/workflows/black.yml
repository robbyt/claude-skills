name: Black Code Formatter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Black
        run: uv run black --check --diff --extend-exclude 'tests/fixtures/' .
