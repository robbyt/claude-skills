name: Lint Claude Plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      SKILLSAW_VERSION: "0.21.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run skillsaw
        run: uv tool run "skillsaw@${SKILLSAW_VERSION}" lint --strict --no-custom-rules .
